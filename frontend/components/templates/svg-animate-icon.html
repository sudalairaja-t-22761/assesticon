<div class="content hidden" id="animateIconPage">
  <div class="panel">
    <div class="panel-header">
      <h3 class="panel-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 8 16 8"/>
        </svg>
        Animate icon
      </h3>
      <div class="panel-actions">
        <button class="btn btn-ghost btn-sm" id="aniClear">Remove all animations</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="cmb">

        <!-- 1 · pick an icon -->
        <div class="cmb-col cmb-pick">
          <div class="cmb-label">1 · Pick an icon</div>
          <input type="search" class="cmb-input" id="aniSearch" placeholder="Search the Icon Library…" autocomplete="off">
          <div class="cmb-status" id="aniPickStatus"></div>
          <div class="cmb-results ani-results" id="aniResults"></div>
        </div>

        <!-- 2 · choose what moves -->
        <div class="cmb-col cmb-stage">
          <div class="cmb-label">2 · Choose a part <span class="cmb-hint" id="aniIconName"></span></div>
          <div class="ani-stage" id="aniStage"></div>
          <div class="cmb-btns ani-play">
            <button type="button" class="btn btn-ghost btn-sm" id="aniPlay">Pause</button>
            <button type="button" class="btn btn-ghost btn-sm" id="aniRestart">Restart</button>
          </div>
          <div class="ani-parts" id="aniParts"></div>
          <div class="cmb-warn" id="aniWarn"></div>
        </div>

        <!-- 3 · animate it, name, add -->
        <div class="cmb-col cmb-side">
          <div class="cmb-label">3 · Animation <span class="cmb-hint" id="aniTarget"></span></div>
          <div class="ani-presets" id="aniPresets"></div>
          <div class="ani-tune" id="aniTune">
            <div class="cmb-fields">
              <label>Duration (s) <input type="number" class="cmb-input" id="aniDur" step="0.1" min="0.1" max="20"></label>
              <label>Delay (s) <input type="number" class="cmb-input" id="aniDelay" step="0.1" min="0" max="20"></label>
              <label>Easing <select class="cmb-input" id="aniEase"></select></label>
              <label>Pivot <select class="cmb-input" id="aniOrigin"></select></label>
            </div>
            <label class="cmb-check"><input type="checkbox" id="aniLoop"> Loop forever</label>
            <label class="cmb-check"><input type="checkbox" id="aniAlt"> Play back and forth</label>
            <div class="ani-steps hidden" id="aniSteps">
              <div class="cmb-label">Customise <span class="cmb-hint">pick a step, drag the sliders, press Play</span></div>
              <div class="ani-chips" id="aniChips"></div>
              <div class="ani-sliders" id="aniSliders"></div>
            </div>
          </div>

          <div class="cmb-label">Preview</div>
          <div class="cmb-preview" id="aniPreview"></div>

          <div class="cmb-label">4 · Name and add</div>
          <input type="text" class="cmb-input" id="aniName" placeholder="icon-name" autocomplete="off" spellcheck="false">
          <div class="cmb-status" id="aniNameStatus"></div>
          <div class="cmb-btns">
            <button type="button" class="btn btn-primary btn-sm" id="aniAdd">Add to Icon Library</button>
            <button type="button" class="btn btn-ghost btn-sm" id="aniCopy">Copy SVG</button>
            <button type="button" class="btn btn-ghost btn-sm" id="aniDownload">Download</button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
