<div class="modal-overlay hidden" id="filenameModal">
  <div class="modal-overlay-bg"></div>
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        Sprite &amp; CSS Name
      </h3>
      <button class="modal-close" id="fnameCloseBtn">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group" id="fnameSpriteGroup">
        <label for="fnameSprite">Sprite file name (without extension)</label>
        <input type="text" id="fnameSprite" value="sprite" class="form-input" placeholder="e.g. my-icons" autocomplete="off" spellcheck="false">
      </div>
      <div class="form-group" id="fnameCssGroup" style="margin-top:12px;">
        <label for="fnameCss">CSS file name (without extension)</label>
        <input type="text" id="fnameCss" value="sprite" class="form-input" placeholder="e.g. my-icons" autocomplete="off" spellcheck="false">
      </div>
      <div class="form-group hidden" id="fnameFolderGroup" style="margin-top:12px;">
        <label for="fnameFolder">Folder name</label>
        <input type="text" id="fnameFolder" value="sprite-icons" class="form-input" placeholder="e.g. my-sprite-folder" autocomplete="off" spellcheck="false">
      </div>

      <!-- Repository commit option (Save to Project only, signed-in users) -->
      <div class="form-group hidden ml-repo-group" id="fnameRepoGroup">
        <label class="checkbox-label">
          <input type="checkbox" id="fnameRepoCommit">
          <span>Save to <strong id="fnameRepoFolder">Master_ui_library</strong> and commit to <strong id="fnameRepoName">CRM_UI_LIBRARY</strong> <span class="ml-branch-badge" id="fnameRepoBranch"></span></span>
        </label>
        <div id="fnameRepoFields" class="hidden">
          <div class="form-group" style="margin-top:10px;">
            <label for="fnameRepoSvg">Sprite file in repository</label>
            <select id="fnameRepoSvg" class="form-input"></select>
          </div>
          <div class="form-group" id="fnameRepoLessGroup" style="margin-top:10px;">
            <label for="fnameRepoLess">Stylesheet file in repository</label>
            <select id="fnameRepoLess" class="form-input"></select>
          </div>
          <div class="form-group" style="margin-top:10px;">
            <label for="fnameRepoMessage">Commit message</label>
            <input type="text" id="fnameRepoMessage" class="form-input" placeholder="Update icons via SpriteForge" autocomplete="off">
          </div>
          <p class="form-hint" id="fnameRepoHint"></p>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="fnameCancel">Cancel</button>
      <button class="btn btn-primary" id="fnameConfirm">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Continue
      </button>
    </div>
  </div>
</div>
