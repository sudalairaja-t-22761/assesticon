<div class="content hidden" id="iconLibraryPage">
  <!-- One plain page, no collapsible panel: filters → icon grid (takes the free height and scrolls) → actions →
       repository + versions. Every id is the one the Library scripts already use. -->
  <section class="lib-shell" id="libBrowseSection" aria-label="Icon library">
    <!-- 1. Filters -->
    <div class="lib-filterbar">
      <div class="lib-filter-row">
        <div class="lib-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" class="lib-search-input" id="libSearch" placeholder="Search icons by name…" autocomplete="off" spellcheck="false">
        </div>
        <span class="lib-result-count"><b id="libIconCount">0</b> icons</span>
        <label class="lib-sort" title="Order of the icons in the grid">
          <span>Sort</span>
          <select id="libSort" aria-label="Sort icons">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="name">Name A–Z</option>
          </select>
        </label>
        <div class="lib-size-selector">
          <button class="lib-size-btn" data-size="small" title="Small tiles">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="4" height="4"/><rect x="9" y="3" width="4" height="4"/><rect x="15" y="3" width="4" height="4"/><rect x="3" y="9" width="4" height="4"/><rect x="9" y="9" width="4" height="4"/><rect x="15" y="9" width="4" height="4"/><rect x="3" y="15" width="4" height="4"/><rect x="9" y="15" width="4" height="4"/><rect x="15" y="15" width="4" height="4"/></svg>
          </button>
          <button class="lib-size-btn active" data-size="medium" title="Medium tiles">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="5"/><rect x="10" y="3" width="5" height="5"/><rect x="17" y="3" width="4" height="5"/><rect x="3" y="10" width="5" height="5"/><rect x="10" y="10" width="5" height="5"/><rect x="17" y="10" width="4" height="5"/></svg>
          </button>
          <button class="lib-size-btn" data-size="large" title="Large tiles">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg>
          </button>
        </div>
      </div>
      <!-- source chips (when there is more than one sprite); the status + category chips are inserted right after it -->
      <div class="lib-source-filter" id="libSourceFilter" role="tablist" aria-label="Icon source"></div>
    </div>

    <!-- 2. Icons -->
    <div class="lib-grid lib-grid-medium" id="libGrid">
      <!-- Rendered by JS -->
    </div>

    <!-- 3. Selection actions (Request verification, the category tools and the marker legend are added by JS) -->
    <div class="lib-actionbar" id="libBulkActions">
      <label class="lib-select-all-label">
        <input type="checkbox" id="libSelectAllVisible">
        <span>Select all visible</span>
      </label>
      <span class="lib-selected-count" id="libSelectedCount">0 selected</span>
      <button class="btn btn-primary btn-sm" id="libAddSelectedBtn" type="button" disabled>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add Selected to Sprite
          </button>
      <button class="btn btn-primary btn-sm" id="libGenerateWebfontBtn" type="button" disabled>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="4 7 4 4 20 4 20 7"/>
              <line x1="9" y1="20" x2="15" y2="20"/>
              <line x1="12" y1="4" x2="12" y2="20"/>
            </svg>
            Generate Webfont
          </button>
    </div>
  </section>

  <!-- 4. Repository + versions -->
  <section class="lib-footer" id="libGridFooter" aria-label="Repository and versions">
    <div class="lib-repo-bar" id="libRepoBar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
      <span class="lib-repo-status" id="libRepoStatus">Repository icons</span>
      <div class="lib-repo-actions" id="libUploadBar">
        <button class="btn btn-primary btn-sm" id="libUploadIconsBtn" type="button" title="Opens a window: drop SVG files, set each icon name, then Submit. The icons are committed to Sprite/crmutil_icons.svg in the Iconassest repository.">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Upload Icons
        </button>
        <button class="btn btn-ghost btn-sm" id="libAddIconBtn" type="button" title="Add SVG icon(s) to Sprite/crmutil_icons.svg after the last icon, without overlapping, and commit to the Iconassest repository">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add icon
        </button>
        <input type="file" id="libAddIconInput" accept=".svg,image/svg+xml" multiple hidden>
        <button class="btn btn-ghost btn-sm" id="libRepoSyncBtn" type="button" title="Fetch the latest Sprite/crmutil_icons.svg from the Iconassest repository and refresh the Library">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          Sync from repo
        </button>
      </div>
    </div>
    <div class="lib-version-bar hidden" id="libVersionBar">
        <div class="lib-version-item lib-version-mock" data-version-item="mock">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          <span class="lib-version-label">Mock version</span>
          <code class="lib-version-value" id="libVersionValue">—</code>
          <span class="lib-version-branch" id="libVersionBranch"></span>
          <button class="btn btn-ghost btn-sm" data-version-copy="mock" type="button" title="Copy the exact mock version from package.json">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span>Copy</span>
          </button>
        </div>
        <div class="lib-version-item lib-version-master" data-version-item="master">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          <span class="lib-version-label">Master version</span>
          <code class="lib-version-value" id="libMasterVersionValue">—</code>
          <span class="lib-version-branch" id="libMasterVersionBranch"></span>
          <button class="btn btn-ghost btn-sm" data-version-copy="master" type="button" title="Copy the exact master version from package.json">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span>Copy</span>
          </button>
        </div>
        <span class="lib-version-name" id="libVersionName"></span>
      </div>
  </section>
</div>

<!-- Library upload window: drag & drop SVGs, name them, Submit -->
<div class="modal-overlay hidden" id="libUploadModal">
  <div class="modal-overlay-bg"></div>
  <div class="modal lib-upload-modal">
    <div class="modal-header">
      <h3>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload Icons to Library
      </h3>
      <button class="modal-close" id="libUploadClose" type="button">&times;</button>
    </div>
    <div class="modal-body">
      <div class="upload-box lib-upload-drop" id="libUploadDrop">
        <div class="upload-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>
        <p class="upload-label">Drag &amp; drop SVG files here, or click to browse</p>
        <p class="upload-hint">One or more .svg files</p>
        <input type="file" id="libUploadInput" accept=".svg,image/svg+xml" multiple hidden>
      </div>
      <div class="lib-upload-list" id="libUploadList"></div>
      <div class="upload-status" id="libUploadStatus"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="libUploadCancel" type="button">Cancel</button>
      <button class="btn btn-primary" id="libUploadSubmit" type="button" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        Submit
      </button>
    </div>
  </div>
</div>
